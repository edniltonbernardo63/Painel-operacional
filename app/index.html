<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUB 142</title>
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HUB 142">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{--bg:#111318; --card:#1a1d24; --line:#2a2e37; --tx:#eef0f4; --dim:#9aa1ad; --shp:#ee4d2d; --ok:#2ec4a6;}
  *{box-sizing:border-box}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--tx); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #painel{position:fixed; top:env(safe-area-inset-top); left:env(safe-area-inset-left); right:env(safe-area-inset-right); bottom:0; width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right)); height:calc(100% - env(safe-area-inset-top)); border:0; background:var(--bg); display:none;}
  body.rodando #painel{display:block}
  body.rodando #tela, body.abrindo #tela{display:none}
  #tela{min-height:100%; display:flex; align-items:center; justify-content:center; padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));}
  .box{width:100%; max-width:460px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px;}
  .logo{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .logo img{width:48px; height:48px; border-radius:12px}
  h1{font-size:19px; margin:0} .sub{color:var(--dim); font-size:13px; margin:2px 0 0}
  p{margin:10px 0; color:var(--dim)} b{color:var(--tx)}
  label{display:block; font-size:13px; font-weight:600; margin:14px 0 6px}
  input{width:100%; font:inherit; color:var(--tx); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:16px}
  button{font:inherit; font-weight:700; border:0; border-radius:10px; padding:12px 14px; cursor:pointer}
  .pri{background:var(--shp); color:#fff; width:100%; margin-top:12px}
  .sec{background:transparent; color:var(--tx); border:1px solid var(--line); width:100%; margin-top:8px}
  .erro{color:#ff6b7f; font-size:13px; min-height:18px; margin-top:8px}
  ol{color:var(--dim); padding-left:20px; margin:8px 0} li{margin:4px 0}
  .ok{color:var(--ok); font-weight:700}
  #carregando{position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:var(--bg); color:var(--dim); z-index:2}
  body.abrindo #carregando{display:flex}
  .spin{width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--shp); animation:g 0.9s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="carregando"><div class="spin"></div><div>Abrindo o painel…</div><button class="sec" id="trocarAbrindo" style="width:auto">Trocar o link</button></div>

<iframe id="painel" title="Painel" allow="clipboard-write; fullscreen"></iframe>

<div id="tela">
  <div class="box">
    <div class="logo"><img src="apple-touch-icon.png" alt=""><div><h1>HUB 142</h1><div class="sub">Equipe &amp; Gestão · aplicativo</div></div></div>
    <div id="passoLink">
      <p>Cole o <b>link do painel</b> (o link <b>/exec</b> da implantação do Apps Script). Ele fica guardado só neste aparelho.</p>
      <label for="link">Link do painel</label>
      <input id="link" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
      <div class="erro" id="erro"></div>
      <button class="pri" id="salvar">Abrir o painel</button>
    </div>
    <div id="passoInstalar" hidden>
      <p class="ok">✓ Link guardado.</p>
      <p id="dica"></p>
      <button class="sec" id="continuar">Só abrir o painel (sem instalar)</button>
    </div>
    <button class="sec" id="trocar" hidden>Trocar o link</button>
    <button class="sec" id="fora" hidden>Abrir no navegador</button>
  </div>
</div>

<script>
(function () {
  var CHAVE = 'painelHub.link';
  var $ = function (id) { return document.getElementById(id); };
  var guardar = function (k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  var ler = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var instalado = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function valido(u) {
    return /^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+|macros)\/s\/[A-Za-z0-9_-]+\/(exec|dev)(\?.*)?$/.test(String(u || '').trim());
  }
  // Abre o painel dentro do app, em tela cheia (a implantação está como "Qualquer pessoa").
  // O endereço leva um número novo a cada abertura para o iPhone nunca mostrar uma versão guardada.
  var timer = null, escondidoEm = 0;
  function comCarimbo(u) { return u + (u.indexOf('?') === -1 ? '?' : '&') + 'app=' + Date.now(); }
  function carregar(u) {
    var f = $('painel');
    f.onload = function () { document.body.classList.remove('abrindo'); };
    setTimeout(function () { document.body.classList.remove('abrindo'); }, 15000);
    f.src = comCarimbo(u);
    document.body.classList.add('rodando');
  }
  function abrir(u) {
    document.body.classList.add('abrindo');
    timer = setTimeout(function () { carregar(u); }, 400);
  }
  // iPhone deixa o app "congelado" em segundo plano: ao voltar depois de 3 min, recarrega o painel (pega a versão nova)
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { escondidoEm = Date.now(); return; }
    if (escondidoEm && Date.now() - escondidoEm > 3 * 60 * 1000 && document.body.classList.contains('rodando') && ler(CHAVE)) {
      document.body.classList.add('abrindo'); carregar(ler(CHAVE));
    }
  });
  function telaLink(msg) {
    document.body.classList.remove('rodando');
    $('passoLink').hidden = false; $('passoInstalar').hidden = true;
    $('link').value = ler(CHAVE) || '';
    $('erro').textContent = msg || '';
    $('trocar').hidden = true;
    $('fora').hidden = !ler(CHAVE);
  }

  // link pode vir no endereço (?u=...) — útil para instalar já configurado
  var q = new URLSearchParams(location.search);
  if (q.get('u') && valido(q.get('u'))) guardar(CHAVE, q.get('u').trim());
  if (q.has('config')) { telaLink(); }
  else if (ler(CHAVE) && instalado) { abrir(ler(CHAVE)); }
  else if (ler(CHAVE)) { telaInstalar(); } // no Safari/Chrome (ainda não instalado): mostra como instalar, sem sair desta página
  else { telaLink(); }

  $('salvar').onclick = function () {
    var u = $('link').value.trim();
    if (!valido(u)) { $('erro').textContent = 'Esse não parece o link do painel. Ele começa com https://script.google.com/ e termina em /exec.'; return; }
    guardar(CHAVE, u);
    if (instalado) { abrir(u); return; }
    telaInstalar();
  };
  function telaInstalar() {
    var u = ler(CHAVE);
    $('passoLink').hidden = true; $('passoInstalar').hidden = false; $('trocar').hidden = false; $('fora').hidden = true;
    $('dica').innerHTML = (ios
      ? 'Agora, <b>ainda nesta tela</b>, toque em <b>Compartilhar</b> (quadrado com seta) › <b>Adicionar à Tela de Início</b> › <b>Adicionar</b>.'
      : 'Agora, <b>ainda nesta tela</b>, toque no menu <b>⋮</b> › <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>).')
      + ' O ícone laranja <b>142</b> aparece na tela inicial; abra o painel sempre por ele.<br><small>Se você adicionar depois de abrir o painel, o ícone sai cinza com "H".</small>';
    history.replaceState(null, '', location.pathname + '?u=' + encodeURIComponent(u));
  }
  $('continuar').onclick = function () { abrir(ler(CHAVE)); };
  $('trocar').onclick = function () { telaLink(); };
  $('trocarAbrindo').onclick = function () { clearTimeout(timer); document.body.classList.remove('abrindo'); document.body.classList.remove('rodando'); $('painel').removeAttribute('src'); telaLink(); };
  $('fora').onclick = function () { var u = ler(CHAVE); if (u) window.open(u, '_blank'); };
  $('link').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('salvar').click(); });

  // Android: botão "Instalar app" do próprio Chrome
  var promptInstalar = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); promptInstalar = e; });
  $('continuar').addEventListener('click', function () { if (promptInstalar) { promptInstalar.prompt(); promptInstalar = null; } });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
