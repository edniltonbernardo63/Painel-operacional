<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central 142</title>
<meta name="description" content="Central de Painéis do HUB LSP-142">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Central 142">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12;--panel:#12151c;--panel2:#171b24;--line:rgba(255,255,255,.08);--txt:#eef0f4;--mut:#9aa1ad;
  --or:#ee4d2d;--or2:#ff7337;--glow:rgba(238,77,45,.35);
  --L:#ffb020;--B:#ee4d2d;--D:#3ba7ff;--P:#2ecc8f;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--or2);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px calc(60px + var(--sb))}

/* HERO */
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden;margin:0 -20px;min-height:300px;
  background:linear-gradient(180deg,rgba(11,13,18,.35) 0%,rgba(11,13,18,.55) 55%,var(--bg) 100%),url("hero.jpg") center 40%/cover,#1a1410}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(800px 300px at 15% 110%,var(--glow),transparent 70%);pointer-events:none}
.top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(18px + var(--st)) 24px 18px}
.brand{display:flex;align-items:center;gap:10px;font:800 15px/1 Sora,sans-serif;letter-spacing:.3px}
.logo{width:36px;height:36px;border-radius:10px;overflow:hidden;box-shadow:0 6px 20px var(--glow)}
.logo img{width:100%;height:100%;display:block}
.right{display:flex;align-items:center;gap:8px}
.clock{font:600 13px/1 Sora,sans-serif;padding:9px 12px;border-radius:10px;background:rgba(11,13,18,.55);border:1px solid var(--line);backdrop-filter:blur(8px);white-space:nowrap}
.clock b{color:var(--or2)}
.menu-btn{width:36px;height:36px;border-radius:10px;background:rgba(11,13,18,.55);border:1px solid var(--line);color:var(--txt);display:grid;place-items:center;backdrop-filter:blur(8px)}
.hero-in{position:relative;z-index:1;padding:28px 24px 34px}
.tag{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 Inter,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:#ffd2c6;background:rgba(238,77,45,.18);border:1px solid rgba(238,77,45,.4);padding:7px 11px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:#2ecc8f;box-shadow:0 0 0 0 rgba(46,204,143,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(46,204,143,0)}100%{box-shadow:0 0 0 0 rgba(46,204,143,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}*{transition:none!important}}
h1{font:800 clamp(30px,5vw,52px)/1.02 Sora,sans-serif;margin:14px 0 8px;letter-spacing:-1px}
h1 span{background:linear-gradient(90deg,var(--or2),var(--or));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#c9ced8;max-width:560px;margin:0 0 22px;font-size:15px}
.search{display:flex;align-items:center;gap:10px;max-width:520px;background:rgba(18,21,28,.8);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 14px;backdrop-filter:blur(10px)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font:500 16px Inter,sans-serif;padding:10px 0;min-width:0}
.kbd{font:600 11px Inter,sans-serif;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:4px 7px}
@media (hover:none){.kbd{display:none}}

/* AVISO DE INSTALAÇÃO */
.install{margin-top:18px;display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;border:1px solid rgba(238,77,45,.4);background:radial-gradient(400px 160px at 0 0,rgba(238,77,45,.2),transparent 70%),var(--panel)}
.install img{width:44px;height:44px;border-radius:11px;flex:none}
.install p{margin:0;font-size:14px;color:#d6dae2;flex:1}
.install p b{color:#fff}
.install .x{flex:none;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--mut)}

/* ÁREAS (chips — aparecem acima dos cards no celular) */
.chips{display:none;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:-2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:999px;padding:8px 13px 8px 9px;font:600 13px Inter,sans-serif}
.chip i{width:20px;height:20px;border-radius:6px;background:var(--c);color:#111;font:800 11px/20px Sora,sans-serif;text-align:center;font-style:normal}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel2))}

/* LAYOUT */
.grid2{display:grid;grid-template-columns:330px 1fr;gap:22px;margin-top:22px}
.grid2>*{min-width:0} /* sem isto a fila de filtros alarga a coluna e os cards saem da tela no celular */
@media(max-width:900px){.grid2{grid-template-columns:1fr}.grid2 main{order:-1}.chips{display:flex}}
@media(max-width:520px){.clock .dt{display:none}.brand{font-size:13px}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}
.box h3{font:700 13px/1 Sora,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:0 0 14px}

/* MAPA */
.map svg{width:100%;height:auto;display:block}
.zone{cursor:pointer;outline:none}
.zone rect{transition:.25s}
.zone:hover rect.z,.zone.on rect.z,.zone:focus-visible rect.z{fill-opacity:.32;stroke-width:2.5}
.zone:focus-visible rect.z{stroke:#fff}
.zone text{font-family:Sora,sans-serif;pointer-events:none}
.legend{display:grid;gap:8px;margin-top:14px}
.leg{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);transition:.2s;color:var(--txt);text-align:left;font-size:14px;width:100%}
.leg:hover,.leg.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--panel2))}
.leg .k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:800 13px Sora,sans-serif;color:#111;background:var(--c)}
.leg .n{flex:1;font-weight:600}
.leg .q{font:600 12px Sora,sans-serif;color:var(--mut)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:800 22px Sora,sans-serif}
.stat span{font-size:12px;color:var(--mut)}

/* CARDS */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.head h2{font:800 22px Sora,sans-serif;margin:0}
.head h2 small{font:500 13px Inter,sans-serif;color:var(--mut);margin-left:8px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:11px;padding:10px 14px;font:600 13px Inter,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn:hover{border-color:rgba(255,255,255,.2)}
.btn.pri{background:linear-gradient(135deg,var(--or2),var(--or));border:0;color:#fff;box-shadow:0 8px 22px var(--glow)}
.btn.wide{width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:18px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s;min-height:170px}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.card::after{content:"";position:absolute;width:160px;height:160px;right:-60px;top:-60px;border-radius:50%;background:var(--c);opacity:.07;transition:.3s;pointer-events:none}
a.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 14px 34px rgba(0,0,0,.4)}
a.card:hover::after{opacity:.16}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.card h4{margin:0;font:700 17px Sora,sans-serif}
.card p{margin:0;color:var(--mut);font-size:13.5px;line-height:1.45;flex:1}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{font:700 11px Sora,sans-serif;letter-spacing:.6px;padding:5px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.go{font:600 13px Inter,sans-serif;display:flex;align-items:center;gap:6px}
.nolink .go{color:var(--mut)}
.edit-tools{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:2}
.edit-tools button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:rgba(11,13,18,.8);color:var(--txt);display:grid;place-items:center}
.edit-tools button:hover{border-color:var(--or)}
.add{border:1.5px dashed rgba(255,255,255,.18);background:transparent;color:var(--mut);align-items:center;justify-content:center;font:600 14px Inter,sans-serif;min-height:170px;border-radius:18px;display:flex;flex-direction:column;gap:8px}
.add:hover{border-color:var(--or);color:var(--txt)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
.foot-note{margin-top:28px;text-align:center;color:var(--mut);font-size:12px}

/* PRIMEIRO ACESSO */
.setup{max-width:520px;margin:28px auto 0}
.setup h2{font:800 22px Sora,sans-serif;margin:0 0 8px}
.setup p{color:var(--mut);margin:0 0 14px;font-size:14.5px;line-height:1.5}
.setup p b{color:var(--txt)}

/* MODAL / MENU */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:50}
.dlg{width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
.dlg h3{font:800 19px Sora,sans-serif;margin:0 0 16px}
.dlg p{color:var(--mut);font-size:14px;line-height:1.5;margin:0 0 12px}
.dlg p b{color:var(--txt)}
.dlg label{display:block;font:600 12px Inter,sans-serif;color:var(--mut);margin:12px 0 6px;letter-spacing:.3px}
.dlg input,.dlg select,.dlg textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--txt);font:500 16px Inter,sans-serif;padding:11px 12px;outline:0}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus{border-color:var(--or)}
.dlg textarea{resize:vertical;min-height:64px}
.erro{color:#ff8a7a;font-size:13px;min-height:18px;margin-top:8px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.menu{display:grid;gap:8px}
.menu .btn{justify-content:flex-start;width:100%}
.steps{margin:0 0 4px;padding-left:20px;color:var(--mut);font-size:14px;line-height:1.55}
.steps b{color:var(--txt)}
.toast{position:fixed;left:50%;bottom:calc(22px + var(--sb));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:11px 16px;border-radius:12px;font:600 13px Inter,sans-serif;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<noscript><p style="padding:20px">Ative o JavaScript para usar a Central de Painéis.</p></noscript>
<script>
(function(){
'use strict';
/* ---------- Configuração ----------
   Os links dos painéis NÃO ficam neste repositório (ele é público).
   Eles ficam guardados só no aparelho e chegam pelo "link da equipe" (?c=...), que o líder envia. */
var CHAVE='central142.cfg', CHAVE_AVISO='central142.avisoInstalar';
var AREAS={
  L:{n:'Liderança',d:'Gestão de líderes e turnos'},
  B:{n:'Produtividade',d:'Bipagem e produtividade'},
  D:{n:'Dashboard',d:'Painel operacional'},
  P:{n:'Parcel',d:'Parcel e inventário'}
};
var ICONS={
  L:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/></svg>',
  B:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5v14M7 5v14M11 5v14M14 5v14M18 5v14M21 5v14"/></svg>',
  D:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  P:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>'
};
var I={
  ext:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>',
  edit:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  del:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa1ad" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  plus:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  dots:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>'
};

/* ---------- utilidades ---------- */
var $=function(id){return document.getElementById(id)};
var ler=function(k){try{return localStorage.getItem(k)}catch(e){return null}};
var guardar=function(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var safeUrl=function(u){return /^https:\/\/[^\s"'<>]+$/i.test(u||'')?u:''};
var instalado=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

/* Codifica a lista de painéis num texto curto para o link da equipe (base64url de JSON, aceita acentos). */
function codificar(panels){
  var json=JSON.stringify(panels.map(function(p){return [p.name,p.url,p.area,p.desc||'']}));
  var bin=String.fromCharCode.apply(null,new TextEncoder().encode(json));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
/* Lê e VALIDA uma configuração vinda de fora (link). Devolve lista limpa ou null. */
function decodificar(txt){
  try{
    var b=String(txt||'').replace(/-/g,'+').replace(/_/g,'/');
    var bin=atob(b+'==='.slice((b.length+3)%4));
    var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    var arr=JSON.parse(new TextDecoder().decode(bytes));
    return limpar(Array.isArray(arr)?arr.map(function(r){return Array.isArray(r)?{name:r[0],url:r[1],area:r[2],desc:r[3]}:r}):null);
  }catch(e){return null}
}
function limpar(arr){
  if(!Array.isArray(arr))return null;
  var out=arr.slice(0,60).map(function(p){
    p=p||{};
    return {name:String(p.name||'').trim().slice(0,80),url:safeUrl(String(p.url||'').trim().slice(0,600)),
      area:AREAS[p.area]?p.area:'D',desc:String(p.desc||'').trim().slice(0,240)};
  }).filter(function(p){return p.name});
  return out.length?out:null;
}
function linkEquipe(){return location.origin+location.pathname+'?c='+codificar(state.panels)}

/* ---------- estado ---------- */
var state={panels:[]};
(function carregar(){
  var q=new URLSearchParams(location.search);
  if(q.has('c')){
    var vindo=decodificar(q.get('c'));
    if(vindo){guardar(CHAVE,JSON.stringify(vindo));state.panels=vindo;state.importado=true;return}
    state.erroLink=true;
  }
  try{state.panels=limpar(JSON.parse(ler(CHAVE)||'null'))||[]}catch(e){state.panels=[]}
})();
function salvar(){
  guardar(CHAVE,JSON.stringify(state.panels));
  // Mantém a configuração no endereço: no iPhone o ícone da tela inicial guarda o endereço atual,
  // e o app instalado não enxerga o que ficou salvo no Safari.
  if(!instalado&&state.panels.length)history.replaceState(null,'',location.pathname+'?c='+codificar(state.panels));
}

var filter='',q='',editing=false,promptInstalar=null;
var app=$('app');

/* ---------- tela ---------- */
function shell(){
  app.innerHTML='<div class="wrap">'+
  '<header class="hero"><div class="top">'+
    '<div class="brand"><div class="logo"><img src="apple-touch-icon.png" alt=""></div>HUB LSP-142</div>'+
    '<div class="right"><div class="clock" id="clock" aria-live="off"></div>'+
    '<button class="menu-btn" id="menu" aria-label="Menu">'+I.dots+'</button></div></div>'+
    '<div class="hero-in"><span class="tag"><i class="dot"></i>Operação · Guarulhos/SP</span>'+
    '<h1>Central de <span>Painéis</span></h1>'+
    '<p class="sub">Todos os painéis do hub em um só lugar: liderança, produtividade, dashboard operacional, parcel e inventário.</p>'+
    (state.panels.length?'<div class="search" role="search">'+I.search+'<input id="q" type="search" aria-label="Buscar painel" placeholder="Buscar painel…" autocomplete="off"><span class="kbd" aria-hidden="true">/</span></div>':'')+
    '</div></header>'+
  '<div id="install"></div>'+
  (state.panels.length?
  '<div class="grid2"><aside><div class="box map"><h3>Mapa do hub</h3>'+
    '<svg viewBox="0 0 300 200" role="group" aria-label="Mapa do hub — escolha uma área para filtrar">'+
    '<rect x="2" y="2" width="296" height="196" rx="14" fill="#0e1117" stroke="rgba(255,255,255,.12)"/>'+
    '<g stroke="rgba(255,255,255,.04)">'+Array.from({length:14},function(_,i){return '<line x1="'+(20+i*20)+'" y1="8" x2="'+(20+i*20)+'" y2="192"/>'}).join('')+'</g>'+
    zone('L',14,14,130,72)+zone('D',156,14,130,72)+zone('B',14,98,180,88)+zone('P',206,98,80,88)+
    '<rect x="120" y="190" width="60" height="6" rx="3" fill="#ee4d2d"/></svg>'+
    '<div class="legend" id="legend"></div><div class="stats" id="stats"></div></div></aside>'+
  '<main><div class="head"><h2 id="ttl">Todos os painéis</h2><div id="tools"></div></div>'+
    '<div class="chips" id="chips" role="group" aria-label="Filtrar por área"></div>'+
    '<div class="cards" id="cards"></div><div class="foot-note">Shopee Xpress · HUB LSP-142</div></main></div>'
  : setupHtml())+
  '</div>';

  if(state.panels.length){
    $('q').addEventListener('input',function(e){q=e.target.value.toLowerCase();render()});
    app.querySelectorAll('.zone').forEach(function(z){
      z.addEventListener('click',function(){setFilter(z.dataset.a)});
      z.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();setFilter(z.dataset.a)}});
    });
  }else ligarSetup();
  $('menu').onclick=abrirMenu;
  tick();
  avisoInstalar();
}
function setupHtml(){
  return '<section class="setup box">'+
    '<h2>'+(state.erroLink?'Link inválido':'Primeiro acesso')+'</h2>'+
    '<p>'+(state.erroLink?'Esse link de instalação está incompleto ou foi alterado. Peça um novo ao líder.':
      'Abra o <b>link da equipe</b> que o líder enviou (WhatsApp) — os painéis já aparecem configurados. Se preferir, cole o link aqui:')+'</p>'+
    '<label for="lk" style="display:block;font:600 12px Inter;color:var(--mut);margin:0 0 6px">Link da equipe</label>'+
    '<input id="lk" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…/central/?c=…" style="width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--txt);font:500 16px Inter;padding:11px 12px;outline:0">'+
    '<div class="erro" id="lkErro"></div>'+
    '<div class="row" style="justify-content:stretch"><button class="btn pri wide" id="lkOk">Carregar painéis</button>'+
    '<button class="btn wide" id="lkNovo">Sou o líder: cadastrar os painéis</button></div></section>';
}
function ligarSetup(){
  $('lkOk').onclick=function(){
    var v=$('lk').value.trim(),m=v.match(/[?&]c=([A-Za-z0-9_-]+)/);
    var lista=m&&decodificar(m[1]);
    if(!lista){$('lkErro').textContent='Não reconheci esse link. Ele deve ter "?c=" no final.';return}
    state.panels=lista;state.erroLink=false;salvar();shell();render();toast('Painéis carregados');
  };
  $('lk').addEventListener('keydown',function(e){if(e.key==='Enter')$('lkOk').click()});
  $('lkNovo').onclick=function(){editing=true;form(-1)};
}
function zone(a,x,y,w,h){
  var c='var(--'+a+')',racks='',i,j;
  if(a==='B'){for(i=0;i<5;i++)racks+='<rect x="'+(x+14+i*32)+'" y="'+(y+40)+'" width="22" height="34" rx="3" fill="'+c+'" fill-opacity=".35"/>'}
  if(a==='P'){for(i=0;i<2;i++)for(j=0;j<2;j++)racks+='<rect x="'+(x+12+i*30)+'" y="'+(y+38+j*22)+'" width="22" height="16" rx="2" fill="'+c+'" fill-opacity=".35"/>'}
  return '<g class="zone" data-a="'+a+'" tabindex="0" role="button" aria-label="Filtrar '+AREAS[a].n+'">'+
    '<rect class="z" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" fill="'+c+'" fill-opacity=".14" stroke="'+c+'" stroke-width="1.5"/>'+racks+
    '<text x="'+(x+12)+'" y="'+(y+24)+'" fill="'+c+'" font-size="17" font-weight="800">'+a+'</text>'+
    '<text x="'+(x+30)+'" y="'+(y+23)+'" fill="#cfd3da" font-size="10.5" font-weight="600">'+AREAS[a].n+'</text></g>';
}
function tick(){
  var el=$('clock');if(!el)return;var d=new Date();
  var t=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'America/Sao_Paulo'});
  var dt=d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',timeZone:'America/Sao_Paulo'});
  var h=+d.toLocaleString('en-US',{hour:'numeric',hour12:false,timeZone:'America/Sao_Paulo'})%24;
  var turno=h>=6&&h<14?'T1':h>=14&&h<22?'T2':'T3';
  el.innerHTML='<span class="dt">'+dt+' · </span><b>'+t+'</b> · '+turno;
}
function setFilter(a){filter=filter===a?'':a;render()}
function render(){
  if(!state.panels.length){shell();return}
  var list=state.panels.filter(function(p){return (!filter||p.area===filter)&&(!q||(p.name+' '+(p.desc||'')+' '+AREAS[p.area].n).toLowerCase().indexOf(q)!==-1)});
  $('ttl').innerHTML=esc(filter?AREAS[filter].n:'Todos os painéis')+'<small>'+list.length+' '+(list.length===1?'painel':'painéis')+'</small>';
  app.querySelectorAll('.zone').forEach(function(z){z.classList.toggle('on',z.dataset.a===filter);z.setAttribute('aria-pressed',z.dataset.a===filter)});
  var cont=function(a){return state.panels.filter(function(p){return p.area===a}).length};
  $('legend').innerHTML=Object.keys(AREAS).map(function(a){return '<button class="leg'+(filter===a?' on':'')+'" style="--c:var(--'+a+')" data-a="'+a+'" aria-pressed="'+(filter===a)+'"><span class="k">'+a+'</span><span class="n">'+AREAS[a].n+'</span><span class="q">'+cont(a)+'</span></button>'}).join('');
  $('chips').innerHTML='<button class="chip'+(filter?'':' on')+'" style="--c:var(--or)" data-a="" aria-pressed="'+!filter+'">Todos</button>'+
    Object.keys(AREAS).map(function(a){return '<button class="chip'+(filter===a?' on':'')+'" style="--c:var(--'+a+')" data-a="'+a+'" aria-pressed="'+(filter===a)+'"><i>'+a+'</i>'+AREAS[a].n+'</button>'}).join('');
  app.querySelectorAll('.leg').forEach(function(b){b.onclick=function(){setFilter(b.dataset.a)}});
  app.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){b.dataset.a?setFilter(b.dataset.a):(filter='',render())}});
  var total=state.panels.length,linked=state.panels.filter(function(p){return safeUrl(p.url)}).length;
  $('stats').innerHTML='<div class="stat"><b>'+total+'</b><span>painéis</span></div><div class="stat"><b style="color:var(--P)">'+linked+'</b><span>com link ativo</span></div>';
  $('tools').innerHTML=editing?'<button class="btn" id="done">Concluir</button>':'';
  if(editing)$('done').onclick=function(){editing=false;render();toast('Alterações salvas neste aparelho')};
  var cards=list.map(function(p){
    var u=safeUrl(p.url),i=state.panels.indexOf(p);
    var inner='<div class="ic">'+ICONS[p.area]+'</div><h4>'+esc(p.name)+'</h4><p>'+esc(p.desc||AREAS[p.area].d)+'</p>'+
      '<div class="foot"><span class="pill">'+p.area+' · '+AREAS[p.area].n.toUpperCase()+'</span><span class="go">'+(u?'Abrir '+I.ext:(editing?'':'Sem link'))+'</span></div>'+
      (editing?'<div class="edit-tools"><button data-e="'+i+'" aria-label="Editar '+esc(p.name)+'">'+I.edit+'</button><button data-d="'+i+'" aria-label="Excluir '+esc(p.name)+'">'+I.del+'</button></div>':'');
    return (u&&!editing)?'<a class="card" style="--c:var(--'+p.area+')" href="'+esc(u)+'" target="_blank" rel="noopener">'+inner+'</a>'
      :'<div class="card'+(u?'':' nolink')+'" style="--c:var(--'+p.area+')">'+inner+'</div>';
  });
  if(editing)cards.push('<button class="add" id="add">'+I.plus+'Novo painel</button>');
  if(!cards.length)cards.push('<div class="empty">Nenhum painel encontrado.</div>');
  var box=$('cards');box.innerHTML=cards.join('');
  box.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){form(+b.dataset.e)}});
  box.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){confirmDel(+b.dataset.d)}});
  if($('add'))$('add').onclick=function(){form(-1)};
}

/* ---------- diálogos (fecham com Esc ou tocando fora) ---------- */
var voltarFoco=null;
function abrirDlg(html,onReady){
  voltarFoco=document.activeElement;
  $('layer').innerHTML='<div class="modal" id="mdl"><div class="dlg" role="dialog" aria-modal="true">'+html+'</div></div>';
  $('mdl').addEventListener('click',function(e){if(e.target.id==='mdl')fecharDlg()});
  if(onReady)onReady();
  var f=$('layer').querySelector('input,select,textarea,button');if(f)f.focus();
}
function fecharDlg(){$('layer').innerHTML='';if(voltarFoco&&voltarFoco.focus)voltarFoco.focus()}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('mdl')){fecharDlg();return}
  var t=document.activeElement&&document.activeElement.tagName;
  if(e.key==='/'&&t!=='INPUT'&&t!=='TEXTAREA'&&$('q')){e.preventDefault();$('q').focus()}
});

function abrirMenu(){
  var tem=state.panels.length>0;
  abrirDlg('<h3>Menu</h3><div class="menu">'+
    (!instalado?'<button class="btn" id="mInst">📲 Instalar no celular</button>':'')+
    (tem?'<button class="btn" id="mLink">🔗 Copiar link da equipe</button>':'')+
    '<button class="btn" id="mEdit">✏️ '+(tem?'Editar painéis':'Cadastrar painéis')+'</button>'+
    (tem?'<button class="btn" id="mTrocar">↺ Trocar configuração</button>':'')+
    '</div><div class="row"><button class="btn" id="mFechar">Fechar</button></div>',function(){
      $('mFechar').onclick=fecharDlg;
      if($('mInst'))$('mInst').onclick=function(){fecharDlg();comoInstalar()};
      if($('mLink'))$('mLink').onclick=function(){fecharDlg();mostrarLink()};
      $('mEdit').onclick=function(){fecharDlg();editing=true;if(state.panels.length){render();$('cards').scrollIntoView({behavior:'smooth'})}else form(-1)};
      if($('mTrocar'))$('mTrocar').onclick=function(){fecharDlg();abrirDlg('<h3>Trocar configuração?</h3><p>Os painéis saem <b>só deste aparelho</b>. Depois é só abrir o link da equipe de novo.</p><div class="row"><button class="btn" id="cx">Cancelar</button><button class="btn pri" id="ok">Trocar</button></div>',function(){
        $('cx').onclick=fecharDlg;$('ok').onclick=function(){state.panels=[];guardar(CHAVE,null);history.replaceState(null,'',location.pathname);fecharDlg();shell()};
      })};
  });
}
function mostrarLink(){
  var l=linkEquipe();
  abrirDlg('<h3>Link da equipe</h3><p>Mande este link pelo WhatsApp. Quem abrir já recebe <b>todos os painéis configurados</b> e pode instalar o app.</p>'+
    '<p style="font-size:13px">⚠️ Os painéis abrem sem login: envie só para quem é da operação.</p>'+
    '<label for="lnk">Link</label><input id="lnk" readonly value="'+esc(l)+'">'+
    '<div class="row"><button class="btn" id="cx">Fechar</button><button class="btn pri" id="cp">Copiar</button></div>',function(){
      $('cx').onclick=fecharDlg;
      $('lnk').addEventListener('focus',function(){this.select()});
      $('cp').onclick=function(){
        var ok=function(){toast('Link copiado');fecharDlg()};
        if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(l).then(ok,function(){$('lnk').select();toast('Selecionei o link — copie manualmente')});
        else{$('lnk').select();toast('Selecionei o link — copie manualmente')}
      };
  });
}
function form(i){
  var p=i>=0?state.panels[i]:{name:'',url:'',area:filter||'B',desc:''};
  abrirDlg('<form id="f"><h3>'+(i>=0?'Editar painel':'Novo painel')+'</h3>'+
    '<label for="fn">Nome</label><input id="fn" name="name" required maxlength="80" value="'+esc(p.name)+'" placeholder="Ex.: Painel de Bipagem">'+
    '<label for="fu">Link</label><input id="fu" name="url" type="url" inputmode="url" autocapitalize="off" value="'+esc(p.url)+'" placeholder="https://script.google.com/…/exec">'+
    '<label for="fa">Área</label><select id="fa" name="area">'+Object.keys(AREAS).map(function(a){return '<option value="'+a+'"'+(a===p.area?' selected':'')+'>'+a+' · '+AREAS[a].n+'</option>'}).join('')+'</select>'+
    '<label for="fd">Descrição (opcional)</label><textarea id="fd" name="desc" maxlength="240" placeholder="O que esse painel mostra">'+esc(p.desc)+'</textarea>'+
    '<div class="erro" id="fErro"></div>'+
    '<div class="row"><button type="button" class="btn" id="cx">Cancelar</button><button class="btn pri">Salvar</button></div></form>',function(){
      $('cx').onclick=fecharDlg;
      $('f').onsubmit=function(e){e.preventDefault();var fd=new FormData(e.target);
        var url=String(fd.get('url')||'').trim();
        if(url&&!safeUrl(url)){$('fErro').textContent='O link precisa começar com https://';return}
        var np={name:String(fd.get('name')).trim().slice(0,80),url:url,area:fd.get('area'),desc:String(fd.get('desc')||'').trim().slice(0,240)};
        var eraVazio=!state.panels.length;
        if(i>=0)state.panels[i]=np;else state.panels.push(np);
        salvar();fecharDlg();if(eraVazio)shell();render();};
  });
}
function confirmDel(i){
  abrirDlg('<h3>Excluir “'+esc(state.panels[i].name)+'”?</h3><p>O painel sai da Central <b>neste aparelho</b>. Para a equipe receber a mudança, envie o link da equipe de novo.</p>'+
    '<div class="row"><button class="btn" id="cx">Cancelar</button><button class="btn pri" id="ok">Excluir</button></div>',function(){
      $('cx').onclick=fecharDlg;$('ok').onclick=function(){state.panels.splice(i,1);salvar();fecharDlg();render()};
  });
}
function toast(t){var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}

/* ---------- instalação ---------- */
function comoInstalar(){
  if(promptInstalar){promptInstalar.prompt();promptInstalar.userChoice.then(function(){promptInstalar=null;avisoInstalar()});return}
  abrirDlg('<h3>Instalar no celular</h3>'+(ios?
    '<ol class="steps"><li>Abra esta página no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b> (quadrado com seta para cima).</li><li>Toque em <b>Adicionar à Tela de Início</b> › <b>Adicionar</b>.</li></ol>':
    '<ol class="steps"><li>Abra esta página no <b>Chrome</b>.</li><li>Toque no menu <b>⋮</b> (canto de cima).</li><li>Toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li></ol>')+
    '<p style="margin-top:12px">O ícone colorido <b>Central 142</b> aparece na tela inicial e abre em tela cheia.</p>'+
    '<div class="row"><button class="btn pri" id="cx">Entendi</button></div>',function(){$('cx').onclick=fecharDlg});
}
function avisoInstalar(){
  var el=$('install');if(!el)return;
  if(instalado||!state.panels.length||ler(CHAVE_AVISO)==='fechado'&&!state.importado){el.innerHTML='';return}
  el.innerHTML='<div class="install"><img src="apple-touch-icon.png" alt=""><p><b>Instale a Central no celular</b><br>'+
    (ios?'Toque em <b>Compartilhar</b> › <b>Adicionar à Tela de Início</b>.':'Tenha o ícone na tela inicial, abrindo em tela cheia.')+'</p>'+
    (ios?'':'<button class="btn pri" id="instBtn">Instalar</button>')+
    '<button class="x" id="instX" aria-label="Fechar aviso">✕</button></div>';
  if($('instBtn'))$('instBtn').onclick=comoInstalar;
  $('instX').onclick=function(){guardar(CHAVE_AVISO,'fechado');state.importado=false;el.innerHTML=''};
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();promptInstalar=e});
window.addEventListener('appinstalled',function(){guardar(CHAVE_AVISO,'fechado');var el=$('install');if(el)el.innerHTML=''});

/* ---------- início ---------- */
if(state.panels.length)salvar();
shell();if(state.panels.length)render();
setInterval(tick,1000);
if(state.importado)setTimeout(function(){toast('Painéis da equipe carregados')},300);
else if(state.erroLink&&state.panels.length)setTimeout(function(){toast('Link da equipe inválido — mantive os painéis que já estavam aqui')},300);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
